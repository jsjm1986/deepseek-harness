# Keyless replay composition for the user-document prompt path. The base
# creates the normal headless agent; this overlay adds the real local document
# store and its durable prompt-context consumer, then replaces the provider
# with deterministic replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: userdoc-local
            name: '@deepseek-ai/dsh-userdoc-local'
            config:
              uploadRoot: !!js "process.env.DSH_USERDOC_UPLOAD_ROOT ?? (process.cwd() + '/uploads')"
              maxInlineTextBytes: 128
          - id: userdoc-context
            name: '@deepseek-ai/dsh-userdoc-context'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
