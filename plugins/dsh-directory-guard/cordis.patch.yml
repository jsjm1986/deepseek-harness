# dsh-directory-guard bundle patch.
#
# 1. Mount the guard plugin so its tools/pre-execute listener is active.
# 2. Re-state the permission-presets table WITHOUT danger-full-access, closing
#    the in-app escape that would otherwise let a session turn off the dsh
#    sandbox. (This mirrors the base `permission` row's config; a patch replaces
#    the whole config, so every retained preset is restated.)
- insert:
    - id: directory-guard
      name: '@deepseek-ai/dsh-directory-guard'

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
